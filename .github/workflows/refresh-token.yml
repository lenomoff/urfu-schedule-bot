name: Refresh Modeus Token

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install selenium

      - name: Обновить секрет MODEUS_TOKEN
        env:
          URFU_USERNAME: ${{ secrets.URFU_USERNAME }}
          URFU_PASSWORD: ${{ secrets.URFU_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN=$(python refresh_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::Не удалось получить токен УрФУ"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | gh secret set MODEUS_TOKEN
          echo "Секрет MODEUS_TOKEN обновлён"
