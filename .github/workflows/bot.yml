name: UrFU Schedule Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: urfu-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install aiogram==3.13.1 aiohttp==3.9.5 selenium

      - name: Восстановить кэш токена
        uses: actions/cache/restore@v4
        with:
          path: token.cache
          key: modeus-token-${{ github.run_id }}
          restore-keys: |
            modeus-token-

      - name: Получить токен УрФУ
        env:
          URFU_USERNAME: ${{ secrets.URFU_USERNAME }}
          URFU_PASSWORD: ${{ secrets.URFU_PASSWORD }}
        run: |
          TOKEN=$(python refresh_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::Не удалось получить токен УрФУ"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "MODEUS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Сохранить кэш токена
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: token.cache
          key: modeus-token-${{ github.run_id }}

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODEUS_TOKEN: ${{ env.MODEUS_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_github.py

      - name: Сохранить state.json
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          touch state.json
          git add state.json
          git diff --staged --quiet || git commit -m "bot: state"
          git pull --rebase origin main
          git push
