name: UrFU Schedule Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install aiogram==3.7.0 aiohttp==3.9.1
      - run: python bot_github.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODEUS_TOKEN: ${{ secrets.MODEUS_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
