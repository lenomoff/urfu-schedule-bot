name: UrFU Schedule Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install aiogram==3.13.1 aiohttp==3.9.5

      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODEUS_TOKEN: ${{ secrets.MODEUS_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_github.py

      - name: Сохранить state.json
        run: |
          if git diff --quiet -- state.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "bot: state"
          git push
